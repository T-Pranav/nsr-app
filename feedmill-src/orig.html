<style>
:root{--bg:#f6f2ea;--sf:#ffffff;--sf2:#f8f6f0;--ink:#15201a;--mu:#68736c;--bd:#e3dfd3;--bd2:#d3cebf;--ac:#1c6a43;--ac2:#2f8c5d;--gold:#b88d2d;--bad:#b3372c;--wn:#9a6b17;--okbg:#e3f1e9;--wnbg:#fbf0d9;--badbg:#fbe5e1;--sh1:0 1px 2px rgba(18,32,24,.07);--sh2:0 14px 34px -16px rgba(18,32,24,.34);--sd1:#fff;--sd2:#fff;--br:#bf202f;--br2:#d2404d;--brbg:#fbe8ea;--brt:#bf202f;--brn:#6a4d35;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14100d;--sf:#1d1713;--sf2:#261f19;--ink:#f1ebe4;--mu:#b3a597;--bd:#3a2f26;--bd2:#4a3d31;--ac:#4cc083;--ac2:#37a66d;--gold:#d9b55c;--bad:#f08879;--wn:#e4b657;--okbg:#173222;--wnbg:#35290e;--badbg:#3b1d19;--sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 14px 34px -16px rgba(0,0,0,.7);--sd1:#1d1713;--sd2:#1d1713;--br:#c8303f;--br2:#de4d5b;--brbg:#3a1a1e;--brt:#f28c95;--brn:#dcc3ab;color-scheme:dark}}
:root[data-theme=dark]{--bg:#14100d;--sf:#1d1713;--sf2:#261f19;--ink:#f1ebe4;--mu:#b3a597;--bd:#3a2f26;--bd2:#4a3d31;--ac:#4cc083;--ac2:#37a66d;--gold:#d9b55c;--bad:#f08879;--wn:#e4b657;--okbg:#173222;--wnbg:#35290e;--badbg:#3b1d19;--sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 14px 34px -16px rgba(0,0,0,.7);--sd1:#1d1713;--sd2:#1d1713;--br:#c8303f;--br2:#de4d5b;--brbg:#3a1a1e;--brt:#f28c95;--brn:#dcc3ab;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"SF Pro Text","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--sf);border-right:1px solid var(--bd);color:var(--brn);padding:22px 14px 16px;display:flex;flex-direction:column;gap:4px}
.brand{display:block;padding:4px 10px 20px}.brand img{display:block;width:100%;max-width:168px;height:auto}.brand .ap{margin-top:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:650}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .brand img{background:#fff;border-radius:12px;padding:8px}}:root[data-theme=dark] .brand img{background:#fff;border-radius:12px;padding:8px}
.brand .lg{width:40px;height:40px;border-radius:12px;background:linear-gradient(140deg,#d9b55c,#f1dba0);display:grid;place-items:center;color:#10281c;box-shadow:0 6px 16px -6px rgba(217,181,92,.6)}
.brand .lg svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand b{display:block;font-size:15px;letter-spacing:.01em;color:#fff;line-height:1.2}.brand small{color:#94ae9f;font-size:11.5px;letter-spacing:.04em}
.ni{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;color:var(--mu);padding:11px 12px;border-radius:11px;font-weight:500;text-align:left;font-size:14px;transition:background .15s,color .15s}
.ni:hover{background:var(--sf2);color:var(--brn)}
.ni.on{background:var(--brbg);color:var(--brt);box-shadow:inset 3px 0 0 var(--br)}
.ni svg,.ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sidef{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--bd);color:var(--mu);font-size:12px}
main{padding:30px 36px 70px;max-width:1220px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:28px;letter-spacing:-.025em;margin:0;line-height:1.15;font-weight:700;color:var(--brn)}.ph p{margin:3px 0 0;color:var(--mu)}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);background:var(--sf);border:1px solid var(--bd);border-radius:99px;padding:5px 11px}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac2)}
.page{animation:fade .28s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mu);margin:28px 0 10px;font-weight:650}
h3{font-size:15px;margin:0 0 12px;font-weight:650;letter-spacing:-.01em}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--bd2);border-radius:10px;padding:8px 12px;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--br);box-shadow:0 0 0 3px color-mix(in srgb,var(--br) 22%,transparent)}
button{cursor:pointer;font-weight:550}button:hover{border-color:var(--br);background:var(--sf2)}
button.on,button.pri{background:linear-gradient(180deg,var(--br2),var(--br));color:#fff;border-color:var(--br);box-shadow:0 6px 14px -8px var(--br)}
button.on:hover,button.pri:hover{background:linear-gradient(180deg,var(--br2),var(--br));filter:brightness(1.06)}
button.dg{color:var(--bad)}button.ghost{background:transparent;font-size:12.5px;padding:6px 11px}
a.btn{display:inline-block;text-decoration:none;color:var(--ink);background:var(--sf);border:1px solid var(--bd2);border-radius:10px;padding:8px 13px;font-weight:550}
a.btn.wa{background:linear-gradient(180deg,#27b862,#1c9a50);color:#fff;border-color:#1c9a50}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.card,.panel{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;box-shadow:var(--sh1)}
.panel{padding:20px}
.card b{display:block;font-size:24px;letter-spacing:-.02em;font-weight:700;margin-top:2px}.card span,small{color:var(--mu);font-size:12px}
.kpi{position:relative;overflow:hidden}.kpi em{display:block;font-style:normal;font-size:12px;color:var(--mu);margin-top:2px}
.kpi .ic{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;background:var(--brbg);color:var(--brt);display:grid;place-items:center}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--br),transparent)}
.up{color:var(--bad)}.dn{color:var(--ac)}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}
.row label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:4px;font-weight:550}
.sc{overflow:auto;border:1px solid var(--bd);border-radius:14px;background:var(--sf);max-width:100%;max-height:72vh;box-shadow:var(--sh1)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:9px 13px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-size:11px;color:var(--mu);font-weight:650;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0;background:var(--sf2);z-index:2}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--sf);z-index:1}
th:first-child{z-index:3;background:var(--sf2)}
tbody tr:hover td,tr:hover td{background:var(--sf2)}
td input{width:68px;padding:4px 7px;text-align:right;border-radius:8px}
tr.bad td{color:var(--bad)}
.bn{padding:11px 14px;border-radius:12px;background:var(--wnbg);border:1px solid color-mix(in srgb,var(--wn) 35%,transparent);color:var(--wn);margin:10px 0}
.bn.soft{background:var(--sf2);border-color:var(--bd);color:var(--mu)}
.ok{color:var(--ac)}
details{margin:12px 0}summary{cursor:pointer;font-weight:600;padding:4px 0}
.chip{display:inline-block;min-width:54px;text-align:center;border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:600}
td.chip{display:table-cell;border-radius:0}
.chip.ok,td.ok{background:var(--okbg);color:var(--ac)}.chip.low,td.low{background:var(--wnbg);color:var(--wn)}.chip.high,td.high{background:var(--badbg);color:var(--bad)}
.seg{display:inline-flex;background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:9px;box-shadow:none}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:var(--sh1);filter:none}
.sheds{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px}
.sheds .row{margin:0;align-items:center}.sheds small{min-width:86px;font-weight:600}
.nrow{display:grid;grid-template-columns:1fr auto;gap:0 14px;align-items:end;padding:12px 0 8px;border-bottom:1px solid var(--bd)}.nrow .ng{grid-column:1/-1;margin-top:2px}
.nrow:last-child{border-bottom:0}.nl b{display:block}.nv{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}.nv b{font-size:18px;letter-spacing:-.02em}
.gz{width:100%;height:38px;display:block}.gt{fill:var(--sf2);stroke:var(--bd)}.gb{fill:var(--okbg);stroke:var(--ac);stroke-opacity:.6}
.gv.ok,.gm.ok{fill:var(--ac)}.gv.low,.gm.low{fill:var(--wn)}.gv.high,.gm.high{fill:var(--bad)}.gm{stroke:var(--sf);stroke-width:2}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
svg.ch text{fill:var(--mu);font-size:11px}svg.ch .gl{stroke:var(--bd);stroke-width:1}svg.ch .bar{fill:var(--brn)}svg.ch .bar.o{opacity:.5}svg.ch .vt{fill:var(--ink);font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#14281e;color:#fff;padding:12px 20px;border-radius:13px;box-shadow:var(--sh2);z-index:50;max-width:min(92vw,560px);font-weight:500;animation:fade .25s}
textarea{width:100%}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
@media(max-width:860px){.shell{display:block}.side{position:fixed;top:auto;left:0;right:0;bottom:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;border-top:1px solid var(--bd);border-right:0;gap:0}
.brand,.sidef{display:none}.ni{flex-direction:column;gap:3px;font-size:10px;padding:7px 0;justify-content:center;align-items:center;text-align:center;flex:1;min-width:0}.ni.on{box-shadow:none;background:var(--brbg)}
main{padding:18px 14px 100px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card b{font-size:19px}.card{padding:13px 14px}.kpi .ic{width:28px;height:28px;right:10px;top:10px}.ni span{font-size:9.5px;letter-spacing:-.01em}.ph h1{font-size:23px}.toast{bottom:86px}th,td{padding:8px 10px}}
.prh{display:none}
@media print{.prh{display:flex;align-items:center;gap:14px;border-bottom:2px solid #6a4d35;padding-bottom:8px;margin-bottom:14px;color:#6a4d35}.prh img{height:54px;width:auto}.side,.acts,.toast,a.btn,button,details,input[type=file]{display:none}.shell{display:block}body{background:#fff;color:#000}main{padding:0}}
.sc textarea,.sc input[list]{text-align:left}.sc textarea{width:100%;min-width:165px;box-sizing:border-box;font:inherit;font-size:13px;padding:6px 8px;border:1px solid rgba(120,140,130,.4);border-radius:8px;background:transparent;color:inherit;resize:vertical}
