<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NSR Poultry Farms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --card:#fffdf8; --ink:#1f2a1f; --muted:#6b7366; --line:#e4dfd2;
  --pri:#6a4d35; --pri-ink:#fff; --pri-soft:#f2e9df; --brand-red:#be1f2e; --amber:#c27a12; --amber-soft:#fbefd9;
  --red:#b3362b; --red-soft:#f8e1de; --ok:#2f7a3d;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141814; --card:#1d221d; --ink:#e9ede6; --muted:#9aa394; --line:#2f362e;
  --pri:#d6ab84; --pri-ink:#1f160e; --pri-soft:#3a2c20; --brand-red:#e05563; --amber:#e3a548; --amber-soft:#3a2d16;
  --red:#ec7b70; --red-soft:#3d1f1c; --ok:#6dbb7a;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans","Noto Sans Tamil",system-ui,sans-serif}
body.ta{font-family:"Noto Sans Tamil","DM Sans",system-ui,sans-serif;font-size:15.5px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#5a3f2a,#6a4d35);border-bottom:3px solid var(--brand-red);color:var(--pri-ink);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:16px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .who{font-size:11.5px;opacity:.85;text-align:right;line-height:1.3}
.lang{display:flex;border:1.5px solid var(--pri-ink);border-radius:20px;overflow:hidden;flex-shrink:0}
.lang button{background:transparent;color:var(--pri-ink);padding:5px 10px;border-radius:0;font-size:13px;font-weight:700}
.lang button.on{background:var(--pri-ink);color:var(--pri)}
main{max-width:860px;margin:0 auto;padding:12px 12px calc(88px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:7px 1px 8px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:500;line-height:1.25}
nav a .ic{display:block;font-size:22px;line-height:1.25}
nav a.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 10px} h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--muted);font-size:13.5px}
label.f{display:block;font-size:13.5px;color:var(--muted);margin:10px 0 4px;font-weight:500}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
input[type=number]{font-size:20px;font-weight:700}
textarea{min-height:60px;resize:vertical}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 16px;background:var(--pri);color:var(--pri-ink);cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.ghost,.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
button.small{padding:8px 12px;font-size:14px;border-radius:9px}
button:disabled{opacity:.45;cursor:default}
.wide{width:100%;margin-top:14px;font-size:18px;padding:15px}
.shedgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.shed{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-weight:700;color:var(--ink);font-size:17px}
.shed small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.shed.done{border-color:var(--pri);background:var(--pri-soft)}
.shed.sel{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.shed.sel small{color:var(--pri-ink)}
.tasks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.task{min-width:0;overflow-wrap:break-word}
body.ta .task{font-size:12.5px;gap:6px;padding:10px 6px}
body.ta .task .ti{font-size:21px}
.task{display:flex;align-items:center;gap:8px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 8px;font-size:14px;line-height:1.3;cursor:pointer;min-height:58px}
.task .ti{font-size:24px;flex-shrink:0}
.task input{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--pri);flex-shrink:0}
.task:has(input:checked){border-color:var(--pri);background:var(--pri-soft)}
input[type=number]::placeholder{color:var(--muted);opacity:.6;font-weight:500;font-size:.78em}
.photo-btn{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--pri);border-radius:12px;padding:18px;color:var(--pri);font-weight:700;font-size:17px;cursor:pointer;margin-top:12px}
.photo-btn .pi{font-size:30px}
.photo-btn input{display:none}
#phPrev{display:none;width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:12.5px;color:var(--muted)} .kpi .v{font-size:23px;font-weight:700} .kpi .s{font-size:12px;color:var(--muted)}
.alert{padding:9px 11px;border-radius:10px;margin:6px 0;font-size:14px}
.alert.r{background:var(--red-soft);color:var(--red)} .alert.a{background:var(--amber-soft);color:var(--amber)} .alert.g{background:#e3f0e3;color:var(--ok)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);padding:6px 5px;white-space:nowrap}
.tbl td:first-child{white-space:nowrap}
.tbl td{border-bottom:1px solid var(--line);padding:7px 5px;vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl input{min-height:40px;padding:7px 8px;font-size:14px}
.scroll{overflow-x:auto}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px}
.pill.r{background:var(--red-soft);color:var(--red)}
.silo-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:4px}.silo-c{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;color:var(--ink);font:inherit;cursor:pointer;width:100%}.silo-c:hover{border-color:var(--ok)}.silo-i{flex:1;min-width:0;display:grid;gap:3px}.silo-n{font-weight:700}.silo-kg{font-size:22px;font-weight:800;letter-spacing:-.3px} .pill.a{background:var(--amber-soft);color:var(--amber)} .pill.g{background:#e3f0e3;color:var(--ok)}
.item{border-bottom:1px solid var(--line);padding:10px 0} .item:last-child{border-bottom:0}
.route{font-size:13px;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:500}
.tabs button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.calc{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--pri-soft);font-size:14.5px}
.stockbox{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:6px;margin-top:10px}
.stockbox div{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:13px}
.stockbox span{display:block;font-size:11px;color:var(--muted)}
.line{border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;background:var(--bg)}
.line .f{margin-top:6px}
.rep-title{font-weight:700;font-size:15px;padding:4px 4px 8px}
.rep{border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap}
.rep th,.rep td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px;text-align:right}
.rep thead th{font-weight:700;text-align:center;font-size:11.5px}
.rep th.gB{background:#dfe9f5;color:#1f3550}.rep th.gE{background:#f8dfe3;color:#5a1f2a}.rep th.gP{background:#e3e3e3;color:#333}
.rep .stk{position:sticky;left:0;background:var(--card);text-align:left;z-index:1}
.rep tr.young td{background:#fff6c7}.rep tr.young td.stk{background:#fff6c7}
.rep td.hl{background:#f7e6e6}.rep td.pc{background:#e8e3f3}.rep td.red{color:#c0281c;font-weight:700}.rep td.party{text-align:center;color:var(--pri);font-weight:700}
.rep tfoot td{font-weight:700;background:var(--pri-soft)}
@media (prefers-color-scheme:dark){.rep th.gB,.rep th.gE,.rep th.gP,.rep tr.young td,.rep td.hl,.rep td.pc{background:var(--bg);color:var(--ink)}}
main.wide{max-width:1500px}
.avgline{padding:8px 4px 2px;font-size:14px}
.note{margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--red-soft);color:var(--red);font-weight:700;text-align:center}
nav a{font-size:10.5px}
nav.mob .ng{flex:1;display:flex;position:static;min-width:0}
nav.mob .ngh{flex:1;display:flex;flex-direction:column;align-items:center;background:none;border:0;box-shadow:none;padding:4px 1px 5px;margin:0 2px;color:rgba(247,239,227,.6);font:600 10.5px "Manrope","Noto Sans Tamil",sans-serif;cursor:pointer;min-width:0}
nav.mob .ngh .gl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav.mob .ngh i{display:none}
nav.mob .ngh .gi{display:flex;width:40px;height:30px;margin:0 auto 3px;border-radius:12px;align-items:center;justify-content:center}
nav.mob .ngh .gi svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.mob .ng.cur .ngh{color:var(--gold)}
nav.mob .ng.cur .ngh .gi{background:linear-gradient(145deg,#f3dcb4,#c6955a);color:#3a2716;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 12px rgba(0,0,0,.35)}
nav.mob .ngi{display:none}
nav.mob .ng.open .ngi{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:30;padding:12px;border-radius:20px;
  background:linear-gradient(180deg,rgba(52,33,19,.98),rgba(30,19,11,.98));border:1px solid rgba(227,195,147,.3);box-shadow:0 14px 40px rgba(0,0,0,.5);animation:ngup .18s ease-out}
nav.mob .ng.open .ngi a{margin:0!important;padding:8px 2px!important;border-radius:14px}
nav.mob .ng.open .ngi a.on{background:rgba(227,195,147,.14)}
@keyframes ngup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
body.light nav.mob .ngh{color:#8a7663}body.light nav.mob .ng.cur .ngh{color:#7a4f22}
body.light nav.mob .ng.open .ngi{background:rgba(255,251,245,.98);border-color:var(--line);box-shadow:0 14px 40px rgba(107,74,49,.25)}

.shed.wait{border-color:var(--amber);background:var(--amber-soft)}
.shed.sel,.shed.sel.wait,.shed.sel.done{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}.shed.sel small{color:var(--pri-ink)}
.shedhead{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.shedhead div{background:var(--pri-soft);border-radius:10px;padding:8px 12px}.shedhead span{display:block;font-size:12px;color:var(--muted)}.shedhead b{font-size:22px}
.stockbox{grid-template-columns:repeat(3,minmax(0,1fr))!important}
h3.sec{margin:18px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.phslot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px dashed var(--pri);border-radius:12px;min-height:96px;font-size:12px;text-align:center;color:var(--pri);font-weight:700;cursor:pointer;overflow:hidden;padding:4px}
.phslot .pi{font-size:26px}.phslot input{display:none}.phslot img{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phslot.has img{display:block}.phslot.has::after{content:'✓';position:absolute;top:4px;right:6px;background:var(--pri);color:var(--pri-ink);border-radius:20px;width:22px;height:22px;line-height:22px;font-size:13px}
.phslot.locked{border-style:solid;border-color:var(--line);color:var(--muted)}
.fmbox{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:var(--bg)}.fmbox h3{margin:0 0 4px}.fmval{padding:11px 0;font-weight:700;font-size:18px}
.diff{font-size:12px;color:var(--amber);font-weight:700;margin-top:2px}
.prodbox{margin-top:14px;padding:12px;border-radius:12px;background:var(--pri-soft)}
.pb-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.pb-top span{display:block;font-size:12px;color:var(--muted)}.pb-top b{font-size:20px}
.pb-top em{font-style:normal;font-weight:700;margin-left:6px;font-size:13px}.pb-cats{font-size:13px;margin-top:8px}
.hr-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.hr-who{min-width:150px;flex:1}.hr-marks{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hm{min-width:46px;min-height:44px;padding:6px 8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:700}.hm.on.mP{background:#2e7d4f;color:#fff;border-color:#2e7d4f}.hm.on.mH{background:#b7791f;color:#fff;border-color:#b7791f}.hm.on.mA{background:#c0392b;color:#fff;border-color:#c0392b}.hm.on.mL{background:#6b5bd2;color:#fff;border-color:#6b5bd2}.hm.on.mO{background:#5d6d7e;color:#fff;border-color:#5d6d7e}
.hr-ot{width:92px!important;min-height:44px}
#xbar{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin:0 0 10px}#xbar .small{padding:6px 12px}
.setup-bar{height:6px;border-radius:9px;background:var(--line);margin:10px 0 6px;overflow:hidden}.setup-bar i{display:block;height:100%;background:var(--pri)}.setup-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}.setup-row:last-child{border-bottom:0}.setup-row .sr-ic{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}.setup-row.done{opacity:.55}.setup-row.done .sr-ic{background:#2e7d4f;border-color:#2e7d4f;color:#fff}
#syncDot{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;margin-right:6px}#syncDot i{width:8px;height:8px;border-radius:50%;background:#2e9e5b;box-shadow:0 0 0 3px rgba(46,158,91,.18)}#syncDot.sync-up i{background:#d69e2e;animation:syncp 1s infinite alternate}#syncDot.sync-off i{background:#c0392b}#syncDot.sync-off{color:#c0392b;border-color:rgba(192,57,43,.4)}@keyframes syncp{to{opacity:.35}}
@media(max-width:520px){#syncDot.sync-ok span{display:none}#syncDot{padding:6px}}.hr-mill{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;flex-wrap:wrap}
.hr-reg td,.hr-reg th{padding:5px 4px;font-size:12px}.hr-reg td.c{text-align:center;min-width:22px}.hr-reg .rP{color:#2e7d4f;font-weight:700}.hr-reg .rA{color:#c0392b;font-weight:700}.hr-reg .rH{color:#b7791f;font-weight:700}.hr-reg .rL{color:#6b5bd2;font-weight:700}.hr-reg .rO{color:var(--muted)}.hr-pend{padding:12px 0;border-bottom:1px solid var(--line)}
.neg{color:var(--red)!important}.pos{color:var(--ok)}.tiny{font-size:10.5px;font-weight:700}
.rep th.gS{background:#e8e3f3;color:#3a2a5a}
#login{display:none;position:fixed;inset:0;z-index:35;background:var(--bg);overflow:auto;padding:24px 16px}#login.show{display:block}
body.locked header,body.locked nav{visibility:hidden}
#login{background:radial-gradient(120% 80% at 50% -10%,#7d5d42 0%,#4a3423 45%,#22160d 100%)!important;color:#f6ede0;padding:0!important}
#login::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.07;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:22px 22px}
.lg-box{position:relative;max-width:440px;margin:0 auto;text-align:center;padding:calc(env(safe-area-inset-top) + 34px) 20px 36px;min-height:100vh;display:flex;flex-direction:column}
.lg-card{width:min(300px,82vw);margin:0 auto;background:#fff;border-radius:22px;padding:18px 24px;box-shadow:0 0 0 1px rgba(226,191,143,.6),0 18px 40px rgba(0,0,0,.4);position:relative}
.lg-card::after{content:'';position:absolute;left:24px;right:24px;bottom:0;height:3px;border-radius:3px;background:#be1f2e}
.lg-card img{display:block;width:100%;height:auto;max-height:150px;object-fit:contain}
.lg-card.sm{width:min(190px,60vw);padding:12px 16px}

  box-shadow:0 0 0 3px #e2bf8f,0 0 0 9px rgba(226,191,143,.18),0 14px 34px rgba(0,0,0,.35)}
.lg-mark img{width:100%;height:100%;object-fit:contain;padding:10px}
.lg-mono{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:38px;color:#6a4d35;letter-spacing:1px}
.lg-name{font-family:"Playfair Display",Georgia,serif;font-size:26px;font-weight:700;letter-spacing:1.5px;margin:18px 0 2px;color:#fff;text-transform:uppercase}

.lg-lang{display:inline-flex;margin:16px auto 0;border:1px solid rgba(226,191,143,.6)!important;border-radius:20px;overflow:hidden}
.lg-lang button{color:#f4efe2!important;background:transparent!important;padding:6px 14px;font-size:13px}.lg-lang button.on{background:#e2bf8f!important;color:#2b1d12!important}
.lg-sub{color:rgba(244,239,226,.75);font-size:14px;margin:22px 0 12px}

  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color .15s,background .15s,transform .1s}

/* ===== Premium app theme (matches login) ===== */
:root{--bg:#f4ede2;--card:#fffdf8;--ink:#24170d;--muted:#7a6a58;--line:#eadfcd;--pri:#6b4a31;--pri-ink:#fff;--pri-soft:#f5ebdc;--brand-red:#c8283a;

@media (prefers-color-scheme:dark){:root{--bg:#f4ede2;--card:#fffdf8;--ink:#24170d;--muted:#7a6a58;--line:#eadfcd;--pri:#6b4a31;--pri-ink:#fff;--pri-soft:#f5ebdc;
  --amber:#b8740f;--amber-soft:#fbf0dc;--red:#b3283a;--red-soft:#fbe4e5;--ok:#2f7a3d}}
html,body{font-family:"Manrope","Noto Sans Tamil",system-ui,sans-serif;background:#1c120b}

  linear-gradient(180deg,#5a3d27 0%,#3a2617 260px,#24170d 100%) fixed;min-height:100vh}
body.ta{font-family:"Noto Sans Tamil","Manrope",system-ui,sans-serif}

  border-bottom:1px solid rgba(227,195,147,.28)!important;box-shadow:0 8px 24px rgba(0,0,0,.25);color:var(--cream)}

#farmTitle img{background:linear-gradient(180deg,#fffdf8,#f6efe4)!important;border-radius:10px!important;padding:4px 10px!important;box-shadow:0 0 0 1px rgba(227,195,147,.55),0 4px 12px rgba(0,0,0,.35)}
header .who{color:var(--cream)}.rolebadge{background:rgba(227,195,147,.18)!important;color:var(--gold);border:1px solid rgba(227,195,147,.35)}
.lang{border:1px solid rgba(227,195,147,.4)!important;background:rgba(255,255,255,.05);padding:3px;border-radius:30px;gap:2px}
.lang button{border-radius:22px!important;color:rgba(247,239,227,.75)!important;font:600 12px "Manrope","Noto Sans Tamil",sans-serif!important;padding:5px 11px!important}
.lang button.on{background:linear-gradient(135deg,#f0d6ad,#c99a5b)!important;color:#2b1d12!important;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#dutyBadge{background:rgba(60,154,82,.18)!important;border:1px solid rgba(95,224,122,.4)!important;color:#c9f2d2!important}
/* page */
main{padding-top:16px}
#view>h2,#view>h3,#view>.muted,#view>p{color:var(--cream)}
.card,.kpi,.duty-card{background:linear-gradient(180deg,#fffdf8,#faf4ea);border:1px solid rgba(227,195,147,.55);border-radius:20px;
  box-shadow:0 0 0 4px rgba(227,195,147,.06),0 14px 34px rgba(0,0,0,.28)}
.card{padding:16px}
.kpi{border-radius:16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,var(--gold),var(--gold2))}
.kpi .l{display:flex;align-items:center;gap:6px;font-weight:600;letter-spacing:.2px}.kpi .v{font-family:"Manrope",sans-serif;font-weight:800;letter-spacing:-.3px;color:var(--deep)}
h2,h3,.duty-card h2,.rep-title{font-family:"Playfair Display",Georgia,"Noto Sans Tamil",serif;font-weight:700;color:var(--deep);letter-spacing:.2px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
body.ta h2,body.ta h3{font-family:"Noto Sans Tamil",serif}
h2{font-size:20px}h3{font-size:17px}
/* icon tiles */
.ico{display:inline-flex;align-items:center;justify-content:center;vertical-align:-.18em;line-height:0;flex-shrink:0}
.ico svg{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h2>.ico:first-child,h3>.ico:first-child,.card>.flex>h3>.ico:first-child{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#f3dcb4,#c6955a);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 10px rgba(107,74,49,.3);color:#3a2716}
h2>.ico:first-child svg,h3>.ico:first-child svg{width:20px;height:20px;stroke-width:1.7}
.kpi .l .ico{width:22px;height:22px;border-radius:7px;background:linear-gradient(145deg,#f3dcb4,#c6955a);color:#3a2716}.kpi .l .ico svg{width:13px;height:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
/* bottom nav */
nav{background:linear-gradient(180deg,rgba(42,26,15,.94),rgba(24,15,9,.97))!important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(227,195,147,.3)!important;box-shadow:0 -10px 28px rgba(0,0,0,.35);padding:6px 4px calc(6px + env(safe-area-inset-bottom))!important}
nav a{color:rgba(247,239,227,.6)!important;font:600 10.5px "Manrope","Noto Sans Tamil",sans-serif!important;padding:4px 1px 5px!important;border-radius:14px;margin:0 2px;transition:color .2s}
nav a .ic{display:flex!important;width:40px;height:30px;margin:0 auto 3px;border-radius:12px;align-items:center;justify-content:center;transition:background .2s,transform .15s}
nav a .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav a.on{color:var(--gold)!important}
nav a.on .ic{background:linear-gradient(145deg,#f3dcb4,#c6955a);color:#3a2716;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 12px rgba(0,0,0,.35)}
nav a:active .ic{transform:scale(.92)}
/* buttons */
button,.btn{background:linear-gradient(135deg,#7a573b,#4f3421);color:#fff;border-radius:14px;font-family:"Manrope","Noto Sans Tamil",sans-serif;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 16px rgba(79,52,33,.28);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .2s}
button:active,.btn:active{transform:scale(.98)}button:hover:not(:disabled){filter:brightness(1.07)}
button.wide{display:flex;width:100%;background:linear-gradient(135deg,#d3324a,#9c1527);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 22px rgba(156,21,39,.32);border-radius:16px}
button.ghost,.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid rgba(107,74,49,.45);box-shadow:none}
button.small{border-radius:10px}
.duty-btn{background:linear-gradient(135deg,#3c9a52,#256b35)!important}
/* tabs */
.tabs{background:rgba(255,255,255,.06);border:1px solid rgba(227,195,147,.28);border-radius:30px;padding:5px;display:inline-flex;flex-wrap:wrap;gap:4px;backdrop-filter:blur(10px)}
.tabs button{background:transparent!important;color:rgba(247,239,227,.8)!important;border:0!important;box-shadow:none;border-radius:24px;padding:9px 16px;font-weight:600}
.tabs button.on{background:linear-gradient(135deg,#f0d6ad,#c99a5b)!important;color:#2b1d12!important;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.card .tabs{background:var(--pri-soft);border-color:var(--line)}.card .tabs button{color:var(--pri)!important}
/* inputs & tiles */
input,select,textarea{background:#fff;border:1.5px solid var(--line);border-radius:12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold2);box-shadow:0 0 0 4px rgba(227,195,147,.3)}
.shed,.task,.stockbox div,.line,.fmbox{background:#fff;border-color:var(--line);border-radius:14px}
.shed{box-shadow:0 2px 6px rgba(107,74,49,.08)}
.shed.done,.task:has(input:checked){background:var(--pri-soft);border-color:var(--gold2)}
.shed.sel,.shed.sel.wait,.shed.sel.done{background:linear-gradient(145deg,#7a573b,#4f3421)!important;border-color:#4f3421!important;color:#fff;box-shadow:0 6px 14px rgba(79,52,33,.35)}
.task .ti,.photo-btn .pi,.phslot .pi{color:var(--pri)}.task .ti .ico svg{width:24px;height:24px}
.photo-btn,.phslot{border-color:var(--gold2);background:linear-gradient(180deg,#fffaf2,#f8efe1)}
.calc,.prodbox,.shedhead div{background:linear-gradient(180deg,#f8eedf,#f2e4cf);border:1px solid rgba(198,149,90,.3)}
.tbl th{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.5px}
.pill{border-radius:20px;padding:3px 10px}
.alert{border-radius:12px;display:flex;align-items:center;gap:8px}
#banner{border-radius:14px;border:1px solid rgba(227,195,147,.4)}
#toast{background:linear-gradient(135deg,#3a2617,#24170d);color:var(--cream);border:1px solid rgba(227,195,147,.45);border-radius:30px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
#modal .box{border-radius:20px;border:1px solid rgba(227,195,147,.55)}
.duty-ic .ico svg{width:56px;height:56px;stroke-width:1.4;color:var(--pri)}
.lg-role-btn .ri .ico svg{width:28px;height:28px}
#langPick{background:radial-gradient(120% 80% at 50% -10%,#6b4a31 0%,#3f2a1b 42%,#1c120b 100%);color:var(--cream)}
main .muted{color:rgba(247,239,227,.7)}.card .muted,.kpi .muted,.duty-card .muted,#modal .muted{color:var(--muted)}
main .ghost{color:var(--cream);border-color:rgba(227,195,147,.5)}.card .ghost,#modal .ghost{color:var(--pri);border-color:rgba(107,74,49,.45)}
main>#view>.flex>button:disabled{color:rgba(247,239,227,.5)}
.row.sale{margin-top:4px}.row.sale .w label{color:var(--red)}.row.sale .w input{border-color:rgba(179,40,58,.3);background:#fff8f8}
.phthumb{position:relative;padding:0;border-radius:12px;overflow:hidden;aspect-ratio:1;background:#eee;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12);display:block}
.phthumb img{width:100%;height:100%;object-fit:cover;display:block}.phthumb span{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:11px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));text-align:left}
.pnl-lock{max-width:440px;margin:30px auto;text-align:center}.pnl-lock .pnl-shield{width:72px;height:72px;margin:6px auto 10px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#f3dcb4,#c6955a);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 24px rgba(107,74,49,.35)}
.pnl-lock .pnl-shield svg{width:36px;height:36px;fill:none;stroke:#3a2716;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.pnl-lock .alert{display:block}
input.pin-in{min-height:38px;padding:6px 8px;font-size:15px!important}
.szgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.szgrid label.f{margin-top:4px;font-size:12px}.szgrid input{padding:8px;font-size:17px!important}@media(max-width:520px){.szgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ckgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}@media(max-width:560px){.ckgrid{grid-template-columns:1fr}}.ckday{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}.ckrow{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}.ckrow b{min-width:48px}.ckrow span{color:var(--amber);font-weight:600}
.fm-link{display:inline-flex;align-items:center;gap:6px;margin-left:auto;padding:6px 12px;border-radius:20px;border:1px solid rgba(227,195,147,.45);color:var(--gold);text-decoration:none;font:700 12px 'Manrope',sans-serif;background:rgba(255,255,255,.05)}.fm-link+#dutyBadge,.fm-link~.who{margin-left:0}
#login .lg-form{display:flex;flex-direction:column;margin-top:26px;animation:lgIn .5s both;animation-delay:.12s}
#login .lg-lbl{font:700 12px 'Manrope','Noto Sans Tamil',sans-serif;letter-spacing:.8px;text-transform:uppercase;color:rgba(247,239,227,.7);margin:14px 4px 7px}
#login .lg-in{display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;border-radius:16px;border:1px solid rgba(227,195,147,.4);background:rgba(255,255,255,.07);transition:border-color .2s,box-shadow .2s}
#login .lg-in:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px rgba(227,195,147,.18)}
#login .lg-in>span svg{width:20px;height:20px;fill:none;stroke:var(--gold);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
#login .lg-in input{flex:1;background:transparent!important;border:0!important;box-shadow:none!important;color:#fff;font:600 18px 'Manrope',sans-serif;padding:16px 4px;min-width:0;outline:none}
#login .lg-in input::placeholder{color:rgba(247,239,227,.35);font-weight:500}
#login .lg-eye{background:transparent!important;box-shadow:none!important;padding:10px!important;border:0}#login .lg-eye svg{width:20px;height:20px;fill:none;stroke:rgba(247,239,227,.6);stroke-width:1.7}
#login .lg-go{margin-top:24px;display:flex;align-items:center;justify-content:center;gap:10px;padding:17px;border-radius:18px;border:0;font:800 18px 'Manrope','Noto Sans Tamil',sans-serif;letter-spacing:.3px;color:#fff;background:linear-gradient(135deg,#d3324a,#9c1527);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 26px rgba(156,21,39,.4)}
#login .lg-go span svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.4;display:block}
#login .lg-form.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#login .lg-mods{display:grid;gap:14px;margin:8px 0 4px}
#login .lg-mod{display:flex;align-items:center;gap:16px;padding:20px 18px;border-radius:20px;border:1px solid rgba(227,195,147,.4);background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.03));color:var(--cream);text-align:left;box-shadow:0 12px 28px rgba(0,0,0,.3);animation:lgIn .5s both;animation-delay:var(--d);width:100%}
#login .lg-mod b{flex:1;font:700 21px 'Playfair Display',Georgia,'Noto Sans Tamil',serif;letter-spacing:.2px}#login .lg-mod b small{display:block;font:600 12px 'Manrope',sans-serif;color:rgba(247,239,227,.6);margin-top:3px}
#login .lg-mod .mi{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#f3dcb4,#c6955a);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 18px rgba(0,0,0,.35);flex-shrink:0}
#login .lg-mod .mi svg{width:32px;height:32px;fill:none;stroke:#3a2716;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#login .lg-mod:active{transform:scale(.98)}
#login #lgOwner{background:rgba(255,255,255,.06)}#login #lgOwner svg{stroke:var(--gold)}

/* ===== Responsive: phone & APK (default) · tablet · desktop web ===== */
@media (min-width:700px) and (max-width:1023px){
  main{max-width:900px;padding-left:20px;padding-right:20px}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  nav{max-width:760px;margin:0 auto 10px;left:0;right:0;border-radius:24px;border:1px solid rgba(227,195,147,.3)!important;bottom:env(safe-area-inset-bottom)}
}
@media (min-width:1024px){
  :root{--side:236px}
  header{padding-left:22px!important;padding-right:22px!important;height:64px}
  #farmTitle img{height:40px!important;max-width:150px!important}
  nav{top:64px;bottom:0;right:auto;width:var(--side);flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;padding:18px 12px!important;
      border-top:0!important;border-right:1px solid rgba(227,195,147,.22)!important;box-shadow:8px 0 28px rgba(0,0,0,.25)!important;display:flex}
  nav a{flex:0 0 auto!important;display:flex!important;align-items:center;gap:12px;text-align:left!important;padding:8px 10px!important;margin:0!important;font-size:14.5px!important;border-radius:14px}
  nav a .ic{margin:0!important;width:38px!important;height:38px!important;flex-shrink:0}
  nav a:hover{background:rgba(255,255,255,.05);color:var(--cream)!important}
  nav a.on{background:rgba(227,195,147,.12)}
  nav{overflow-y:auto;gap:2px!important;padding-bottom:24px!important}
  nav .ng{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
  nav .ngh{display:flex!important;align-items:center;justify-content:space-between;background:none;border:0;cursor:pointer;color:var(--gold);font:800 11.5px "Manrope",sans-serif;letter-spacing:.09em;text-transform:uppercase;padding:10px 10px 6px;margin:0;border-radius:10px;width:100%;box-shadow:none}
  nav .ngh:hover{background:rgba(255,255,255,.04)}
  nav .ngh i{font-style:normal;transition:transform .2s;opacity:.7}
  nav .ngh .gi{display:none!important}
  nav .ng.c .ngh i{transform:rotate(-90deg)}
  nav .ng .ngi{display:flex;flex-direction:column;gap:2px}
  nav .ng.c .ngi{display:none}
  nav .ng a{padding:6px 10px!important;font-size:14px!important}
  nav .ng a .ic{width:34px!important;height:34px!important}
  main,main.wide{margin-left:var(--side)!important;margin-right:0!important;max-width:none!important;width:auto!important;min-width:0;padding:26px 34px 40px!important;box-sizing:border-box}
  main>#view{min-width:0}main .card{max-width:100%;box-sizing:border-box}
  main>#view,main>#banner{max-width:1240px;margin-left:auto;margin-right:auto}
  main.wide>#view{max-width:1600px}
  .kpis{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))!important;gap:14px}
  .card{padding:20px 22px}
  .row{gap:16px}
  #toast{bottom:28px;left:calc(50% + var(--side)/2)}
  .shedgrid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))!important}
  /* login: glass card in the middle of the brand background */
  #login{display:none;align-items:center;justify-content:center;padding:40px}
  #login.show{display:flex!important}
  #login .lg-box{min-height:auto!important;width:480px;max-width:480px!important;margin:auto;border-radius:30px;padding:40px 44px 30px!important;
      background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid rgba(227,195,147,.28);box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  #login .lg-foot{padding-top:22px}
  #login .lg-mod:hover,#login .lg-role-btn:hover,#login .lg-user:hover{transform:translateY(-2px);border-color:rgba(227,195,147,.6)}
  .pnl-lock{margin:60px auto}
}
@media (min-width:1600px){main>#view{max-width:1400px}}
#login .lg-keep{display:flex;align-items:center;gap:10px;margin:16px 4px 0;font:600 14px 'Manrope','Noto Sans Tamil',sans-serif;color:rgba(247,239,227,.8);cursor:pointer;justify-content:flex-start;text-align:left}

#login .pad+.lg-keep{justify-content:center}

body.light .tabs{background:rgba(107,74,49,.07);border-color:var(--line)}body.light .tabs button{color:var(--pri)!important}
body.light nav{background:rgba(255,251,245,.94)!important;border-top:1px solid var(--line)!important;box-shadow:0 -8px 24px rgba(107,74,49,.12)!important}

function stats(arr){const n=arr.length;if(!n)return{n:0};const m=arr.reduce((a,b)=>a+b,0)/n;
  const sd=n>1?Math.sqrt(arr.reduce((a,b)=>a+(b-m)**2,0)/(n-1)):0;return{n,mean:m,sd,min:Math.min(...arr),max:Math.max(...arr),cv:m?sd/m*100:0}}

  const mx=pts.reduce((a,p)=>a+p[0],0)/n,my=pts.reduce((a,p)=>a+p[1],0)/n;let nu=0,de=0;pts.forEach(([x,y])=>{nu+=(x-mx)*(y-my);de+=(x-mx)**2});return de?nu/de*7:null}

function compressPhoto(file,stamp,maxPx=900){return new Promise((res,rej)=>{

function getGPS(){return new Promise(res=>{
  if(!navigator.geolocation)return res({gps:'none'});
  const tm=setTimeout(()=>res({gps:'timeout'}),9000);
  try{navigator.geolocation.getCurrentPosition(
    p=>{clearTimeout(tm);res({gps:'ok',lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)})},
    e=>{clearTimeout(tm);res({gps:e.code===1?'denied':'unavailable'})},{enableHighAccuracy:true,timeout:8000,maximumAge:10000})}
  catch(e){clearTimeout(tm);res({gps:'blocked'})}})}

/* --- movement analysis --- */
function zoneOf(la,ln){const r=num(S.farm.shedRadius)||100;let best=null,near=false,ref=false;
  SHEDS.forEach(s=>{const f=S.flock[s]||{};if(f.lat&&f.lng){ref=true;const d=distM(la,ln,+f.lat,+f.lng);if(d<=r&&(!best||d<best.d))best={s,d};if(d<=Math.max(400,r*4))near=true}});
  if(best)return best.s;if(S.farm.lat&&S.farm.lng){ref=true;if(distM(la,ln,+S.farm.lat,+S.farm.lng)<=(num(S.farm.radius)||300))return'farm'}
  if(near)return'farm';return ref?'out':'farm'}
function analyseDuty(d){const pts=(d.pts||[]).slice().sort((a,b)=>a[0]-b[0]);const ev=(d.ev||[]).slice().sort((a,b)=>a.t-b.t);
  const endT=d.end||Date.now();const gaps=[];let ps=null;
  ev.forEach(e=>{if(e.k==='pause')ps=ps||e.t;else if((e.k==='resume'||e.k==='start'||e.k==='end')&&ps){gaps.push([ps,e.t]);ps=null}});if(ps)gaps.push([ps,endT]);
  for(let i=1;i<pts.length;i++){const a=pts[i-1][0],b=pts[i][0];if(b-a>15*60000&&!gaps.some(g=>g[0]<b&&g[1]>a))gaps.push([a,b])}
  gaps.sort((a,b)=>a[0]-b[0]);const inGap=t=>gaps.some(g=>t>g[0]&&t<g[1]);
  const segs=[];pts.forEach((p,i)=>{const z=zoneOf(p[1],p[2]);const to=i<pts.length-1?pts[i+1][0]:endT;const L=segs[segs.length-1];
    if(L&&L.z===z&&!inGap(p[0]))L.to=to;else segs.push({z,from:p[0],to})});
  /* cut gap time out of segments */
  const tl=[];segs.forEach(s=>{let from=s.from;gaps.forEach(g=>{if(g[0]>=from&&g[0]<s.to){if(g[0]>from)tl.push({z:s.z,from,to:g[0]});from=Math.max(from,g[1])}});if(s.to>from)tl.push({z:s.z,from,to:s.to})});
  gaps.forEach(g=>tl.push({z:'gap',from:g[0],to:g[1]}));tl.sort((a,b)=>a.from-b.from);
  const merged=[];tl.forEach(s=>{const L=merged[merged.length-1];if(L&&L.z===s.z&&s.from-L.to<120000)L.to=s.to;else merged.push({...s})});
  let dist=0;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(a[3]<=60&&b[3]<=60){const m=distM(a[1],a[2],b[1],b[2]);if(m<1500)dist+=m}}
  const by={};merged.forEach(s=>{by[s.z]=(by[s.z]||0)+(s.to-s.from)});const total=endT-d.start;
  return {pts,gaps,tl:merged,dist,by,total,gapMs:by.gap||0,outMs:by.out||0}}
function trackSvg(d,A){const pts=A.pts;const shedPts=SHEDS.map(s=>[s,S.flock[s]||{}]).filter(([s,f])=>f.lat&&f.lng).map(([s,f])=>[s,+f.lat,+f.lng]);
  const all=[...pts.map(p=>[p[1],p[2]]),...shedPts.map(x=>[x[1],x[2]])];if(!all.length)return `<div class="muted">${t('noTrack')}</div>`;
  let la0=Math.min(...all.map(p=>p[0])),la1=Math.max(...all.map(p=>p[0])),ln0=Math.min(...all.map(p=>p[1])),ln1=Math.max(...all.map(p=>p[1]));
  const k=Math.cos((la0+la1)/2*Math.PI/180);let w=(ln1-ln0)*k,h=la1-la0;const pad=Math.max(w,h)*0.12+0.0004;
  const W=600,H=320;const sx=W/((w+2*pad)||1),sy=H/((h+2*pad)||1),sc=Math.min(sx,sy);
  const X=ln=>((ln-ln0)*k+pad)*sc+(W-(w+2*pad)*sc)/2,Y=la=>H-(((la-la0)+pad)*sc+(H-(h+2*pad)*sc)/2);
  const r=(num(S.farm.shedRadius)||100)/111320*sc;
  const path=pts.map((p,i)=>(i?'L':'M')+X(p[2]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" class="trk" role="img" aria-label="${t('routeMap')}">
    ${shedPts.map(([s,la,ln])=>`<circle cx="${X(ln)}" cy="${Y(la)}" r="${Math.max(6,r)}" class="trk-shed"/><text x="${X(ln)}" y="${Y(la)+4}" class="trk-lbl">${s}</text>`).join('')}
    ${pts.length>1?`<path d="${path}" class="trk-path"/>`:''}
    ${pts.map(p=>`<circle cx="${X(p[2])}" cy="${Y(p[1])}" r="2.2" class="trk-pt"><title>${fmtTime(p[0])} · ±${p[3]} m</title></circle>`).join('')}
    ${pts.length?`<circle cx="${X(pts[0][2])}" cy="${Y(pts[0][1])}" r="7" class="trk-start"><title>${t('dutyStart')} ${fmtTime(pts[0][0])}</title></circle>
    <circle cx="${X(pts[pts.length-1][2])}" cy="${Y(pts[pts.length-1][1])}" r="7" class="trk-end"><title>${fmtTime(pts[pts.length-1][0])}</title></circle>`:''}</svg>`}

V.health={tab:'due',
mount(el){
  el.innerHTML=`<div class="card"><h2>💉 ${t('h_title')}</h2>
    <div class="row"><div><label class="f">${t('shed')}</label><select id="hShed"><option value="ALL">${t('allSheds')}</option>${SHEDS.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div>
    <div><label class="f">${t('type')}</label><select id="hType">${VTYPES.map(k=>`<option value="${k}">${t('ty_'+k)}</option>`).join('')}</select></div></div>
    <label class="f">${t('hName')}</label><input id="hName">
    <div class="row"><div><label class="f">${t('route')}</label><select id="hRoute">${VROUTES.map(k=>`<option value="${k}">${t('r_'+k)}</option>`).join('')}</select></div>
    <div><label class="f">${t('due')}</label><input type="date" id="hDue" value="${today()}"></div></div>
    <button class="wide" id="hAdd">➕ ${t('addSched')}</button></div>
    <div class="card"><div class="tabs" id="hTabs"></div><div id="hList"></div></div>`;
  $('#hAdd').onclick=()=>this.add();this.update()},
async add(){
  const name=$('#hName').value.trim();if(!name)return toast(t('needName'));
  const sh=$('#hShed').value;const list=sh==='ALL'?SHEDS.filter(s=>num((S.flock[s]||{}).birds)>0):[sh];
  if(!list.length)return toast(t('needBirds'));
  try{for(const s of list)await put('vacc',uid('h'),{shed:s,name,type:$('#hType').value,route:$('#hRoute').value,due:$('#hDue').value,by:S.me,ts:Date.now()});
    $('#hName').value='';toast(t('scheduled',{n:list.length}))}catch(e){toast(t('couldNotSave'))}},
update(){
  const td=today(),wk=addDays(td,7);
  const groups={due:S.vacc.filter(v=>!v.doneDate&&v.due<=wk).sort((a,b)=>a.due<b.due?-1:1),
    later:S.vacc.filter(v=>!v.doneDate&&v.due>wk).sort((a,b)=>a.due<b.due?-1:1),
    done:S.vacc.filter(v=>v.doneDate).sort((a,b)=>a.doneDate<b.doneDate?1:-1).slice(0,40)};
  $('#hTabs').innerHTML=[['due','tabDue'],['later','tabLater'],['done','tabDone']].map(([k,l])=>`<button class="small ${this.tab===k?'on':''}" data-k="${k}">${t(l)} (${groups[k].length})</button>`).join('');
  $('#hTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{this.tab=b.dataset.k;this.update()});
  const L=groups[this.tab];
  $('#hList').innerHTML=L.length?L.map(v=>{const od=!v.doneDate&&v.due<td,dt=!v.doneDate&&v.due===td;
    return `<div class="item"><div class="flex"><b>${esc(v.shed)}</b> ${esc(v.name)} <span class="muted">${esc(tType(v.type))} · ${esc(tRoute(v.route))}</span>
    ${v.doneDate?`<span class="pill g right">${t('doneOn',{d:fmtDate(v.doneDate)})}</span>`:`<span class="pill ${od?'r':dt?'a':'g'} right">${t(od?'overdue':dt?'todayW':'dueS')} ${fmtDate(v.due)}</span>`}</div>
    ${v.doneDate?`<div class="route">${t('givenBy',{n:esc(nameOf(v.doneBy))})}${v.batch?' · '+t('batch')+' '+esc(v.batch):''}</div>`:
    `<div class="flex" style="margin-top:8px"><input placeholder="${t('batchNo')}" data-b="${v.id}" style="flex:1;min-width:120px"><button class="small" data-d="${v.id}">${t('markGiven')}</button>
    ${S.canSettings?`<button class="small ghost" data-x="${v.id}">${t('del')}</button>`:''}</div>`}</div>`}).join('')
    :`<div class="muted">${t('nothing')}</div>`;
  $('#hList').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const v=S.vacc.find(x=>x.id===b.dataset.d);if(!v)return;
    const {id,...rest}=v;const batch=($(`[data-b="${id}"]`)||{}).value||'';
    try{await put('vacc',id,{...rest,doneDate:today(),doneBy:S.me,doneTs:Date.now(),batch});toast(t('markedGiven'))}catch(e){toast(t('couldNotSave'))}});
  $('#hList').querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.sure){try{await remove('vacc',b.dataset.x)}catch(e){toast(t('couldNotDelete'))}}else{b.dataset.sure=1;b.textContent=t('tapAgain')}})}};

const fT=n=>(n==null||n===0)?'':(Math.round(n*10)/10).toLocaleString('en-IN',{maximumFractionDigits:1});
const fS=n=>(n==null)?'':(Math.round(n*10)/10).toLocaleString('en-IN',{minimumFractionDigits:1,maximumFractionDigits:1});
const fB=n=>(n==null||n===0)?'':fmtN(n);
const fP=n=>(n==null)?'':(n>0?'+':'')+(Math.round(n*10)/10).toFixed(1);
const f1=n=>n==null||!isFinite(n)?'–':(Math.round(n*10)/10).toFixed(1);
const stIcon=r=>!r?'':r.status==='ok'?(r.changed?'⚠️':'✅'):'⏳';
function numIn(id,label,val,extra=''){return `<div><label class="f">${label}</label><input type="number" inputmode="decimal" min="0" step="any" id="${id}" value="${val??''}" ${extra}></div>`}
function mySheds(){if(role()!=='sup')return SHEDS;const st=S.user&&staffById(S.user.id);const l=(st&&st.sheds)||[];return l.length?SHEDS.filter(s=>l.includes(s)):SHEDS}
function shedLoc(sh){const f=S.flock[sh]||{};if(f.lat&&f.lng)return{lat:num(f.lat),lng:num(f.lng),r:num(S.farm.shedRadius)||100,shed:true};
  if(S.farm.lat&&S.farm.lng)return{lat:num(S.farm.lat),lng:num(S.farm.lng),r:num(S.farm.radius)||300,shed:false};return null}
function gpsCheck(g,sh){const o={st:g.gps};if(g.gps!=='ok')return o;o.lat=g.lat;o.lng=g.lng;o.acc=g.acc;const L=shedLoc(sh);
  if(L){o.dist=Math.round(distM(g.lat,g.lng,L.lat,L.lng));o.outside=o.dist>L.r+Math.min(g.acc||0,50);o.ref=L.shed?'shed':'farm'}return o}
function gpsBadge(o){if(!o)return'';if(o.st!=='ok')return `<span class="pill a">📍 ${gpsL(o.st)}</span>`;

function shedChips(dt,sel){return (role()==='sup'?mySheds():SHEDS).map(s=>{const r=(S.calc[dt]||{})[s];const st=r?(r.status==='ok'?'done':'wait'):'';
  return `<button class="shed ${st} ${sel===s?'sel':''}" data-s="${s}">${s}<small>${r?stIcon(r):'—'}</small></button>`}).join('')}

function setSess(v,keep){try{if(!v){sessionStorage.removeItem(SESS);localStorage.removeItem(SESS);localStorage.removeItem('lf-remember');return}
  sessionStorage.setItem(SESS,v);if(keep){localStorage.setItem(SESS,v);localStorage.setItem('lf-remember','1')}else{localStorage.removeItem(SESS);localStorage.removeItem('lf-remember')}}catch(e){}}

  if(s==='owner'&&(S.isOwner||(S.mode==='local'&&!S.staff.some(x=>x.role==='admin')))){S.user={id:'owner',name:S.myName||t('roleAdmin'),role:'admin',mill:'admin'};S.me='owner';return true}

/* ================= SECURE ACCOUNTS (Firebase hosting) =================
   Each staff member gets their own Firebase login. The PIN/password is checked by Firebase, not by the phone.
   Management's phone keeps the list with passwords (secure/staff, Management-only); everyone else sees names only (public/staff). */
const SEC={
  on(){return typeof FB!=='undefined'&&FB&&!!window.firebase&&!!firebase.auth&&!!(firebase.apps&&firebase.apps.length)},
  email(id){return String(id).toLowerCase().replace(/[^a-z0-9]/g,'')+'@staff.nsr-poultry-farms.app'},
  pw(p){return 'NSR-'+p+'-farm'},
  authed(){const u=this.on()&&firebase.auth().currentUser;return !!(u&&!u.isAnonymous)},
  app2(){if(!this._a2){this._a2=firebase.initializeApp(window.FIREBASE_CONFIG,'nsr-accounts');try{this._a2.auth().setPersistence(firebase.auth.Auth.Persistence.NONE)}catch(e){}}return this._a2},
  async ensure(st,oldPin){const a=this.app2().auth(),em=this.email(st.id);let uid;
    try{const c=await a.createUserWithEmailAndPassword(em,this.pw(st.pin));uid=c.user.uid}
    catch(e){if(e.code!=='auth/email-already-in-use')throw e;const c=await a.signInWithEmailAndPassword(em,this.pw(oldPin||st.pin));if(oldPin&&oldPin!==st.pin)await c.user.updatePassword(this.pw(st.pin));uid=c.user.uid}
    try{await a.signOut()}catch(e){}return uid},
  async remove(st){try{const a=this.app2().auth(),c=await a.signInWithEmailAndPassword(this.email(st.id),this.pw(st.pin));await c.user.delete()}catch(e){}},
  async save(list){audit('staff',list.length+' users',list.map(x=>x.name+':'+(x.role||'')).join(', '));const old=S.staff,byId=Object.fromEntries(old.map(x=>[x.id,x])),out=[];
    for(const x of list){const o=byId[x.id];let uid=x.uid||(o&&o.uid);if(!uid||!o||String(o.pin)!==String(x.pin))uid=await this.ensure(x,o&&o.pin);
      const y={...x,uid};out.push(y);await db.doc('users/'+uid).set({staff:x.id,name:x.name,role:layerRole(x)||'',mill:millRole(x)||'',sheds:x.sheds||[],pnl:!!x.pnl&&!!layerRole(x),veh:!!x.veh})}
    for(const o of old)if(!list.some(x=>x.id===o.id)){await this.remove(o);if(o.uid)try{await db.doc('users/'+o.uid).delete()}catch(e){}}
    await db.doc('secure/staff').set({list:out});
    await db.doc('public/staff').set({secured:true,list:out.map(({pin,uid,...r})=>({...r,pl:String(pin||'').length}))});
    await db.doc('settings/staff').set({secured:true,list:out.map(({pin,...r})=>r)})},
  async login(st,secret,keep){const A=firebase.auth();try{await A.setPersistence(keep?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION)}catch(e){}
    try{await A.signInWithEmailAndPassword(this.email(st.id),this.pw(secret));return true}
    catch(e){return e.code==='auth/network-request-failed'?'net':e.code==='auth/too-many-requests'?'many':false}},
  /* logging out also wipes the data saved on this phone, so the next person cannot see it */
  async out(){if(this.authed()){try{const f=firebase.firestore();await f.terminate();await f.clearPersistence()}catch(e){}try{await firebase.auth().signOut()}catch(e){}location.reload();return true}return false},
  async migrate(btn){if(!S.staff.length)return;const miss=S.staff.filter(x=>!x.pin);if(miss.length)return toast(t('secNoPin',{n:miss.map(x=>x.name).join(', ')}));
    btn.disabled=true;let i=0;try{for(const x of S.staff){btn.textContent=t('secWorking',{i:++i,n:S.staff.length});}await this.save(S.staff);
      showModal(`<h3>🔒 ${t('secDoneT')}</h3><div>${t('secDone')}</div>`);setTimeout(()=>{setSess(null);location.reload()},6000)}
    catch(e){btn.disabled=false;btn.textContent=t('secGo');toast(t(e&&e.code==='auth/operation-not-allowed'?'secEnable':'secFail')+(e&&e.code?' ('+e.code+')':''))}}};

/* ================= ANALYSIS: standards & statistics ================= */
function lineChart(box,days,series,opt={}){
  const W=Math.max(260,box.clientWidth||600),H=opt.h||220,P={l:36,r:10,t:10,b:opt.small?16:26};
  const all=series.flatMap(s=>s.vals).filter(v=>v!=null&&isFinite(v));
  if(!all.length){box.innerHTML=`<div class="muted" style="padding:20px 0">${t('noData')}</div>`;return}
  let lo=Math.min(...all),hi=Math.max(...all);const step=opt.step||5;lo=Math.floor((lo-1)/step)*step;hi=Math.ceil((hi+1)/step)*step;if(hi===lo)hi=lo+step;
  const X=i=>P.l+(days.length<2?0:i*(W-P.l-P.r)/(days.length-1)),Y=v=>P.t+(hi-v)*(H-P.t-P.b)/(hi-lo);
  const ticks=[];for(let v=lo;v<=hi+1e-9;v+=step)ticks.push(v);while(ticks.length>6){ticks.splice(1,ticks.length-2,...ticks.slice(1,-1).filter((_,i)=>i%2))}
  const path=vals=>{let d='',pen=false;vals.forEach((v,i)=>{if(v==null||!isFinite(v)){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=true});return d};
  const xl=opt.small?[]:[0,Math.floor((days.length-1)/2),days.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  box.innerHTML=`${series.length>1&&!opt.small?`<div class="legend">${series.map(s=>`<span><i style="border-top:2px ${s.dash?'dashed':'solid'} ${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:''}
    <div class="chartwrap"><svg width="${W}" height="${H}" role="img" aria-label="${esc(opt.label||'')}">
    ${ticks.map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${P.l-6}" y="${Y(v)+4}" class="axis" text-anchor="end">${v}</text>`).join('')}
    ${xl.map(i=>`<text x="${X(i)}" y="${H-6}" class="axis" text-anchor="${i===0?'start':i===days.length-1?'end':'middle'}">${opt.xfmt?opt.xfmt(days[i]):fmtShort(days[i])}</text>`).join('')}
    ${series.map(s=>`<path d="${path(s.vals)}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`).join('')}
    ${series.map(s=>s.vals.map((v,i)=>(v!=null&&isFinite(v)&&(s.vals[i-1]==null)&&(s.vals[i+1]==null))?`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${s.dash?'var(--card)':s.color}" stroke="${s.color}" stroke-width="2"/>`:'').join('')).join('')}
    ${series.filter(s=>!s.dash).map(s=>{let i=s.vals.length-1;while(i>=0&&(s.vals[i]==null))i--;return i<0?'':`<circle cx="${X(i)}" cy="${Y(s.vals[i])}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`}).join('')}
    <line class="xhair" y1="${P.t}" y2="${H-P.b}" style="display:none"/><g class="hdots"></g><rect x="${P.l}" y="0" width="${W-P.l-P.r}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip" style="display:none"></div></div>`;
  const svg=box.querySelector('svg'),tip=box.querySelector('.tip'),xh=box.querySelector('.xhair'),dots=box.querySelector('.hdots');
  const show=e=>{const r=svg.getBoundingClientRect();const px=e.clientX-r.left;let i=Math.round((px-P.l)/((W-P.l-P.r)/Math.max(1,days.length-1)));i=Math.max(0,Math.min(days.length-1,i));
    xh.setAttribute('x1',X(i));xh.setAttribute('x2',X(i));xh.style.display='';
    dots.innerHTML=series.map(s=>s.vals[i]==null?'':`<circle cx="${X(i)}" cy="${Y(s.vals[i])}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`).join('');
    tip.style.display='block';tip.innerHTML=`<b>${opt.xfmt?opt.xfmt(days[i]):fmtDate(days[i])}</b>${series.map(s=>`<div><i style="border-top:2px ${s.dash?'dashed':'solid'} ${s.color}"></i>${esc(s.name)}: <b>${s.vals[i]==null?'–':(opt.money?rs(s.vals[i]):f1(s.vals[i])+(opt.unit||''))}</b></div>`).join('')}`;
    const tx=Math.min(Math.max(0,X(i)+12),W-tip.offsetWidth-4);tip.style.left=(X(i)>W*0.6?X(i)-tip.offsetWidth-12:tx)+'px';tip.style.top='6px'};
  const hide=()=>{tip.style.display='none';xh.style.display='none';dots.innerHTML=''};
  const hit=box.querySelector('.hit');hit.addEventListener('pointermove',show);hit.addEventListener('pointerdown',show);hit.addEventListener('pointerleave',hide)}

function mortData(days){const sheds=SHEDS.filter(s=>(S.flock[s]||{}).birds||(S.flock[s]||{}).hatch);

    const rates=daily.map(x=>x.b?x.n/x.b*100:0).sort((a,b)=>a-b);const med=rates.length?rates[Math.floor(rates.length/2)]:0;
    daily.forEach(x=>{const rt=x.b?x.n/x.b*100:0;if(x.n>=5&&rt>Math.max(0.03,med*3))spikes.push(x)});

  return{rows,byDay,clusters}}

    const j=await res.json();if(!res.ok)throw new Error((j.error&&j.error.message)||('HTTP '+res.status));

/* ===== Farm Advisor (management): rules from BV300 standards + this farm's data ===== */
function advisorShed(sh,to){const days=[];for(let i=6;i>=0;i--)days.push(addDays(to,-i));
  const R=days.map(d=>[d,(S.calc[d]||{})[sh]]).filter(x=>x[1]);const w=curWeek(sh,to);const b=bvAt(w);const lay=isLayer(sh)&&w>=19;
  const F=[];const add=(lv,key,p,acts)=>F.push({lv,key,p:p||{},acts});
  const missing=days.filter(d=>{const r=(S.calc[d]||{})[sh];return !r||r.status!=='ok'}).length;
  if(!R.length){add('a','advNoData',{},['advActEnter']);return{sh,w,F,score:1,act:null,std:null}}
  const avg=(arr,f)=>{const v=arr.map(f).filter(x=>x!=null&&isFinite(x));return v.length?v.reduce((a,c)=>a+c,0)/v.length:null};
  const act=avg(R,x=>x[1].pct),std=lay&&b&&b.hdp?b.hdp:avg(R,x=>x[1].stdPct);
  if(lay&&act!=null&&std){const gap=act-std;
    if(gap<-8)add('r','advGapBig',{g:f1(-gap),a:f1(act),s:f1(std)},['advActLight','advActFeed','advActWater','advActHeat','advActVet']);
    else if(gap<-3)add('a','advGap',{g:f1(-gap),a:f1(act),s:f1(std)},['advActLight','advActFeed','advActWater','advActHeat']);
    else add('g','advOnStd',{a:f1(act),s:f1(std)},[]);
    if(w<=30&&gap<-3)add('a','advPeak',{w},['advActBW','advActDensity','advActLight16'])}
  /* sudden drop */
  if(lay&&R.length>=5){const last=R.slice(-3),prev=R.slice(0,-3);const a1=avg(last,x=>x[1].pct),a0=avg(prev,x=>x[1].pct);
    if(a1!=null&&a0!=null&&a0-a1>=2){let start=last[0][0];for(const [d,r] of R){if(r.pct!=null&&a0-r.pct>=1.5){start=d;break}}
      const vac=S.vacc.filter(v=>v.shed===sh&&v.doneDate&&v.doneDate>=addDays(start,-5)&&v.doneDate<=start).map(v=>v.name);
      add('r','advDrop',{d:f1(a0-a1),s:fmtDate(start)},vac.length?['advActVacc|'+vac.join(', '),'advActStress','advActFeedChange']:['advActStress','advActFeedChange','advActWater','advActVet'])}}
  /* mortality */
  const open=R[0][1].openB||0,dead=R.reduce((a,[d,r])=>a+num(r.mort)+num(r.culls),0);
  if(open){const wk=dead/open*100,stdWk=Math.max(0.03,(depAt(w)-depAt(Math.max(1,w-1))));
    if(wk>Math.max(0.15,stdWk*2.5))add(wk>0.5?'r':'a','advMort',{m:wk.toFixed(2),s:stdWk.toFixed(2),n:fmtN(dead)},['advActPM','advActVet','advActBio','advActHeat'])}
  {const sg=R.flatMap(([d,r])=>r.pm||[]);const cs=pmCauses(sg).filter(c=>c!=='cPM');if(cs.length)add(cs.some(c=>URG[c]==='r')?'r':'a','advPm',{c:cs.slice(0,2).map(c=>t(c)).join(', ')},cs.slice(0,2).map(c=>'act_'+c))}
  /* body weight */
  {wtWatch();const lw=wtLastOf(sh);if(lw){const a=wtAge(lw),sb=wtStdBw(a),se=wtStdEw(a),dd=Math.round((new Date(today()+'T12:00:00')-new Date(lw.date+'T12:00:00'))/864e5);
    if(sb&&dd<=21){const p=(lw.bw-sb)/sb*100;if(p<-5)add(p<-10?'r':'a','advBwLow',{a:fmtN(lw.bw),s:sb,p:Math.abs(p).toFixed(1),d:fmtShort(lw.date)},['advActBwFeed','advActBwGrade','advActWater','advActWeigh']);
      else if(p>8)add('a','advBwHigh',{a:fmtN(lw.bw),s:sb,p:p.toFixed(1),d:fmtShort(lw.date)},['advActBwEnergy','advActWeigh'])}
    if(se&&num(lw.ew)&&dd<=21&&lw.ew<se-2)add('a','advEwLow',{a:lw.ew,s:se,d:fmtShort(lw.date)},['advActProtein','advActBWLay']);
    if(dd>21&&w<=40)add('a','advBwOld',{n:dd},['advActWeigh'])}}
  /* feed */
  const fd=R.filter(([d,r])=>r.feed&&r.closeB);if(fd.length>=3&&b){const g=avg(fd,([d,r])=>r.feed*1000/r.closeB);const sf=w<=18?rearFeed()[Math.max(1,w)-1]:b.feed;
    if(sf&&g<sf*0.92)add('a','advFeedLow',{g:Math.round(g),s:sf},['advActHeat','advActWater','advActFeeder','advActFeedTimes']);
    else if(sf&&g>sf*1.08)add('a','advFeedHigh',{g:Math.round(g),s:sf},['advActWaste','advActRats','advActFeederH','advActEnergy']);
    if(lay){const eggs=fd.reduce((a,[d,r])=>a+num(r.tot)*TRAY,0);if(eggs&&b.fpe){const fpe=fd.reduce((a,[d,r])=>a+r.feed,0)*1000/eggs;
      if(fpe>b.fpe*1.1)add('a','advFpe',{f:Math.round(fpe),s:b.fpe},['advActWaste','advActProdFirst','advActFormula'])}}}
  /* egg quality */
  if(lay){const T=R.reduce((a,[d,r])=>a+num(r.tot),0),P=k=>R.reduce((a,[d,r])=>a+num((r.prod||{})[k]),0);
    if(T>0){const dirty=P('dt')/T*100,dam=(P('shDam')+R.reduce((a,[d,r])=>a+num(r.vDam),0))/T*100,small=P('s')/T*100;
      if(dirty>3)add('a','advDirty',{p:f1(dirty)},['advActCollect','advActCage','advActLoose']);
      if(dam>1.2)add(dam>2.5?'r':'a','advDamage',{p:f1(dam)},w>=60?['advActCalcium','advActCollect','advActCageFloor','advActOld']:['advActCalcium','advActCollect','advActCageFloor','advActHandling']);

  /* old flock */
  if(lay&&w>=72&&act!=null&&act<75)add('a','advOld',{w,a:f1(act)},['advActBreakEven','advActReplace']);
  /* overdue vaccines */
  const od=S.vacc.filter(v=>v.shed===sh&&!v.doneDate&&v.due<to);if(od.length)add('r','advVaccOverdue',{v:od.map(v=>v.name).join(', ')},['advActVaccDo']);
  if(missing>=2)add('a','advMissing',{n:missing},['advActEnter']);
  const score=F.reduce((a,f)=>a+(f.lv==='r'?10:f.lv==='a'?3:0),0);return{sh,w,F,score,act,std}}
function advisorView(to){const sheds=SHEDS.filter(s=>(S.flock[s]||{}).hatch||(S.flock[s]||{}).birds);const A=sheds.map(s=>advisorShed(s,to)).sort((a,b)=>b.score-a.score);

  const trDate=btMv().filter(m=>m.batch===code&&m.kind!=='init'&&/^B-/.test(m.to)).map(m=>m.date).sort()[0]||'';
  const warn={cpk:0,necc:0,est:0,rate:0,unpriced:0},inpC={};const inpAt=d=>inpC[d]||(inpC[d]=pnlInputs(d).inp);
  const days=(S.dates||[]).filter(d=>d>upto&&(!start||d>=start)&&d<=to);
  const A=(d,sh,cat,amt,x)=>{if(amt)E.push({d,cat,sh,ph:/^B-/.test(sh)?'lay':'rear',amt,auto:1,...x})};
  const labOf=sh=>sh.startsWith('C-')?C.labC:sh.startsWith('G-')?C.labG:C.labB;
  /* feed: what the feed mill PRODUCED for the shed while this batch was in it (kg × item rates); daily-report kg × ₹/kg only if the feed mill has no records */
  const fmOn=Object.keys(FMS.days||{}).length>0;
  if(fmOn){Object.keys(FMS.days).filter(d=>d>upto&&(!start||d>=start)&&d<=to).sort().forEach(d=>{const dd=FMS.days[d]||{};

      if(!Object.keys(f).length){const rg=(FMS.reg||{})[l.replace('-','_')];if(rg)f=rg.f||{}}
      let kg=0,cost=0;for(const n in f){const q=num(f[n])*nb;if(!q)continue;const it=FMS.items[fmId(n)];kg+=q;if(it&&num(it.r))cost+=q*num(it.r);else warn.rate++}
      A(d,sh,'feed',cost,{qty:kg,unit:'kg',rate:kg?cost/kg:0,item:t('bplFmProd')+(dd.fv&&dd.fv[l]?' · '+dd.fv[l]:'')});A(d,sh,'grind',kg/1000*num(C.grind),{qty:kg/1000,unit:'t'});A(d,sh,'eb',kg/1000*num(C.eb),{qty:kg/1000,unit:'t'})})})}

        if(!rt&&RATE_OF[k]!=='rw'){rt=num(inp.necc)?eggRate(inp,p):0;est=true;if(!rt)warn.necc++}amt+=tr*TRAY*rt});
      if(est)warn.unpriced++;A(d,sh,'egg',amt,{qty:eggs,unit:'eggs',rate:eggs?amt/eggs:0,item:(l.p||t('party'))+(est?' *':'')})})}});

function btAt(sh,dt){let c=null;for(const m of btMv()){if((m.date||'')>dt)break;if(m.to===sh)c=m.batch}return c}

async function btTx(fn,what){const ref=db&&db.doc('settings/batches');
  if(ref&&typeof db.runTransaction==='function'){const next=await db.runTransaction(async tx=>{const sn=await tx.get(ref);let cur=JSON.parse(JSON.stringify(sn.exists?sn.data():{}));cur.list=cur.list||[];cur.mv=cur.mv||[];fn(cur);cur=JSON.parse(JSON.stringify(cur));tx.set(ref,cur);return cur});S.bt=next;audit('batch',what||'','');compute();refresh();return next}
  if(typeof FB!=='undefined'&&FB&&db)throw{code:'offline'};const cur=JSON.parse(JSON.stringify(S.bt||{}));cur.list=cur.list||[];cur.mv=cur.mv||[];fn(cur);S.bt=cur;await putSetting('batches',cur);compute();refresh();return cur}
/* current sheds of a batch with birds */
function btSheds(code,dt){dt=dt||today();return SHEDS.map(sh=>({sh,b:btAt(sh,dt)===code?Math.max(0,birdsAt(sh,dt)):0})).filter(x=>x.b>0)}
/* existing birds: group sheds by hatch date, oldest first */
function btInitPlan(){const g={},no=[];SHEDS.forEach(sh=>{const b=birdsAt(sh,today());if(!(b>0))return;const h=(S.flock[sh]||{}).hatch;if(h)(g[h]=g[h]||[]).push(sh);else no.push(sh)});
  /* hatch dates within 3 days of the group's first date are one batch (same chick lot); batch hatch = earliest */
  const out=[];Object.keys(g).sort().forEach(h=>{const last=out[out.length-1];if(last&&(new Date(h+'T12:00:00')-new Date(last.hatch+'T12:00:00'))/864e5<=3){last.sheds.push(...g[h]);last.to=h}else out.push({hatch:h,to:h,sheds:g[h].slice()})});
  return out.concat(no.map(sh=>({hatch:'',sheds:[sh]})))}
/* code the birds already on the farm (oldest hatch first); runs by itself for Management / Administrator when every shed with birds has a hatch date */
async function btCreateInit(){const P=btInitPlan();if(!P.length||P.some(p=>!p.hatch)||btList().length)return 0;
  await btTx(cur=>{if(cur.list.length)return;let n=0;P.forEach(p=>{const code='NC-'+String(++n).padStart(3,'0');cur.list.push({code,hatch:p.hatch,date:p.hatch,breed:'BV-300',qty:p.sheds.reduce((a,s)=>a+birdsAt(s,today()),0),src:'existing',ts:Date.now()});

/* weekly data of a batch, built from the daily shed records it occupied */
function btWeekly(code){const B=btGet(code);if(!B)return[];const W={},wk=dt=>{const a=Math.floor((new Date(dt+'T12:00:00')-new Date(B.hatch+'T12:00:00'))/864e5);return a<0?0:Math.floor(a/7)+(a%7?1:0)||1};
  const g=w=>W[w]=W[w]||{w,sheds:new Set(),open:null,openD:null,mort:0,culls:0,shiftM:0,sold:0,eggs:0,prod:{},bd:0,feed:0,feedBd:0,days:new Set()};
  S.dates.forEach(dt=>{const R=S.calc[dt]||{};SHEDS.forEach(sh=>{const r=R[sh];if(!r||btAt(sh,dt)!==code)return;const x=g(wk(dt));x.sheds.add(sh);x.days.add(dt);
    if(x.openD==null||dt<x.openD){x.openD=dt;x.open=0}if(dt===x.openD)x.open+=num(r.openB);
    x.mort+=num(r.mort);x.culls+=num(r.culls);x.sold+=num(r.sold);x.bd+=num(r.closeB);if(r.feed){x.feed+=num(r.feed);x.feedBd+=num(r.closeB)}
    if(r.prod){PK.forEach(k=>{x.prod[k]=(x.prod[k]||0)+num(r.prod[k])*TRAY});x.eggs+=num(r.tot)*TRAY}})});
  btMv().filter(m=>m.batch===code&&num(m.mort)).forEach(m=>{g(wk(m.date)).shiftM+=num(m.mort)});
  return Object.values(W).sort((a,b)=>a.w-b.w)}

  if(!L.length){btAuto(this);const office=['chk','admin'].includes(role());el.innerHTML=`<div class="card"><h2>📈 ${t('frTitle')}</h2><div class="muted">${t('frNone')}</div></div>${office?btInitCard():''}`;btInitBind(this);return}
  const B=btGet(this.code)||L[0];this.code=B.code;const sheds=frSheds(B.code);if(this.sh!=='all'&&!sheds.includes(this.sh))this.sh='all';
  const pick=this.sh==='all'?sheds:[this.sh],multi=pick.length>1;
  const days=(S.dates||[]).filter(d=>d>=this.from&&d<=this.to);let cumM=0;const out=[];
  days.forEach(d=>{const R=S.calc[d]||{};const rs=pick.map(s=>({s,r:R[s]})).filter(x=>x.r&&x.r.batch===B.code);if(!rs.length)return;
    const a={d,sheds:rs.map(x=>x.s),birds:0,open:0,mort:0,culls:0,tot:0,hasP:false,dt:0,lt:0,w:0,cum:0,housed:0,stdP:null,stdH:null,wk:ageStr(rs[0].s,d)};
    rs.forEach(({r})=>{a.birds+=num(r.closeB);a.open+=num(r.openB);a.mort+=num(r.mort);a.culls+=num(r.culls);if(r.tot!=null){a.hasP=true;a.tot+=r.tot;a.dt+=num(r.prod.dt);a.lt+=num(r.prod.lt)}a.w+=frWaste(r);
      if(r.hhp){a.cum+=num(r.cum);a.housed+=num(r.cum)/r.hhp}if(a.stdP==null&&r.stdPct!=null)a.stdP=r.stdPct;if(a.stdH==null&&r.stdHhp!=null)a.stdH=r.stdHhp});
    cumM+=a.mort+a.culls;a.cumM=cumM;out.push(a)});
  const P=(x,y)=>y?(x/y*100):null,f1=v=>v==null||!isFinite(v)?'–':v.toFixed(1),f2=v=>v==null||!isFinite(v)?'–':v.toFixed(2),fT=v=>fmtN(Math.round(v*10)/10);
  const rows=out.map(a=>{const pp=a.hasP&&a.birds?a.tot*TRAY/a.birds*100:null,hh=a.housed?a.cum/a.housed:null,gap=pp!=null&&a.stdP!=null?pp-a.stdP:null;
    return `<tr><td>${fmtDate(a.d)}</td>${multi?`<td>${a.sheds.join(', ')}</td>`:''}<td class="n">${a.wk}</td><td class="n">${fmtN(a.birds)}</td><td class="n">${a.mort}</td><td class="n">${a.culls}</td><td class="n">${f2(P(a.mort+a.culls,a.open))}</td><td class="n">${fmtN(a.cumM)}</td>
      <td class="n">${a.hasP?fT(a.tot):'–'}</td><td class="n"><b class="${gap!=null&&gap<-3?'neg':''}">${f1(pp)}</b></td><td class="n">${f1(a.stdP)}</td><td class="n">${f1(hh)}</td><td class="n">${f1(a.stdH)}</td>
      <td class="n">${a.hasP?fT(a.dt):'–'}</td><td class="n">${f2(a.hasP?P(a.dt,a.tot):null)}</td><td class="n">${a.hasP?fT(a.lt):'–'}</td><td class="n">${f2(a.hasP?P(a.lt,a.tot):null)}</td><td class="n">${fT(a.w)}</td><td class="n">${f2(a.hasP?P(a.w,a.tot):null)}</td></tr>`}).join('');
  const T=out.reduce((t_,a)=>{t_.mort+=a.mort;t_.culls+=a.culls;if(a.hasP){t_.tot+=a.tot;t_.bd+=a.birds;t_.dt+=a.dt;t_.lt+=a.lt}t_.w+=a.w;return t_},{mort:0,culls:0,tot:0,bd:0,dt:0,lt:0,w:0});
  const last=out[out.length-1],avgP=T.bd?T.tot*TRAY/T.bd*100:null,lastH=last&&last.housed?last.cum/last.housed:null;

  el.innerHTML=`<div class="card"><h2>📈 ${t('frTitle')}</h2><div class="muted">${t('frSub')}</div>
    <div class="row" style="margin-top:10px"><div><label class="f">${t('frFlock')}</label><select id="frB">${L.map(b=>`<option value="${b.code}" ${b.code===B.code?'selected':''}>${b.code} · ${fmtDate(b.hatch)}${btSheds(b.code).length?' · '+btSheds(b.code).map(x=>x.sh).join(', '):''}</option>`).join('')}</select></div>
    <div><label class="f">${t('frShed')}</label><select id="frS">${shedOpts.map(([v,l])=>`<option value="${v}" ${v===this.sh?'selected':''}>${l}</option>`).join('')}</select></div></div>
    <div class="row"><div><label class="f">${t('frFrom')}</label><input type="date" id="frF" value="${this.from}"></div><div><label class="f">${t('frTo')}</label><input type="date" id="frT" value="${this.to}" max="${today()}"></div></div></div>
    ${out.length?`<div class="kpis">${kpi(t('frAvgProd'),f1(avgP)+'%',t('frDays',{n:out.length}))}${kpi(t('frMort'),fmtN(T.mort+T.culls),t('frMort')+' '+T.mort+' · '+t('frCulls')+' '+T.culls)}${kpi(t('frLastHHP'),f1(lastH),last&&last.stdH!=null?'BV300 '+f1(last.stdH):'')}${kpi(t('frWasteP'),f2(T.tot?T.w/T.tot*100:null)+'%',t('frDirtyP')+' '+f2(T.tot?T.dt/T.tot*100:null)+' · '+t('frLeatherP')+' '+f2(T.tot?T.lt/T.tot*100:null))}</div>`:''}
    <div class="card"><h3 class="rep-title">${t('frTitle')} – ${B.code}${this.sh==='all'?'':' · '+this.sh} · ${fmtDate(this.from)} – ${fmtDate(this.to)}</h3>
    ${out.length?`<div class="scroll"><table class="tbl"><tr><th>${t('date')}</th>${multi?`<th>${t('frSheds')}</th>`:''}<th class="n">${t('wtWeek')}</th><th class="n">${t('frBirds')}</th><th class="n">${t('frMort')}</th><th class="n">${t('frCulls')}</th><th class="n">${t('frMortP')}</th><th class="n">${t('frCumMort')}</th><th class="n">${t('frProd')}</th><th class="n">${t('frProdP')}</th><th class="n">${t('frStd')}</th><th class="n">${t('frHHP')}</th><th class="n">${t('frStdHHP')}</th><th class="n">${t('frDirty')}</th><th class="n">${t('frDirtyP')}</th><th class="n">${t('frLeather')}</th><th class="n">${t('frLeatherP')}</th><th class="n">${t('frWaste')}</th><th class="n">${t('frWasteP')}</th></tr>${rows}
      <tr><td><b>${t('frTotal')}</b></td>${multi?'<td></td>':''}<td></td><td class="n">${last?fmtN(last.birds):''}</td><td class="n"><b>${T.mort}</b></td><td class="n"><b>${T.culls}</b></td><td></td><td class="n"><b>${last?fmtN(last.cumM):''}</b></td><td class="n"><b>${fT(T.tot)}</b></td><td class="n"><b>${f1(avgP)}</b></td><td></td><td class="n"><b>${f1(lastH)}</b></td><td></td><td class="n"><b>${fT(T.dt)}</b></td><td class="n"><b>${f2(T.tot?T.dt/T.tot*100:null)}</b></td><td class="n"><b>${fT(T.lt)}</b></td><td class="n"><b>${f2(T.tot?T.lt/T.tot*100:null)}</b></td><td class="n"><b>${fT(T.w)}</b></td><td class="n"><b>${f2(T.tot?T.w/T.tot*100:null)}</b></td></tr></table></div>
      <div class="tiny muted" style="margin-top:6px">${t('frWasteH')}</div>`:`<div class="muted">${t('frNoRows')}</div>`}</div>`;
  $('#frB').onchange=e=>{this.code=e.target.value;this.sh='all';this.draw()};$('#frS').onchange=e=>{this.sh=e.target.value;this.draw()};
  $('#frF').onchange=e=>{if(e.target.value){this.from=e.target.value;this.draw()}};$('#frT').onchange=e=>{if(e.target.value){this.to=e.target.value;this.draw()}}}};

function route(){$('#view')._dirty=false;hideModal();if(!S.user)return;
  const allowed=navOf();let v=(location.hash||'').slice(1);if(!allowed.includes(v))v=allowed[0];
  if(dutyRole()&&!TR.active()&&v!=='myrep'){cur=null;xbarShow(null);document.querySelectorAll('#nav a').forEach(a=>a.classList.remove('on'));dutyScreen($('#view'));dutyBadge();return}
  if(dutyRole()&&TR.active()&&TR.watch==null)TR.resume(true);
  cur=v;document.querySelector('main').classList.toggle('wide',['home','report','summary','analysis','track','pnl','hr','sop','wt','batch','frep'].includes(v));
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));navMark();V[v].mount($('#view'));xbarShow(v);window.scrollTo(0,0);dutyBadge()}

function refresh(){if(S.user&&cur&&V[cur].update)V[cur].update();else if(S.user&&dutyRole()&&!cur&&!TR.active()&&$('#dStart')&&!$('#dStart').disabled)dutyScreen($('#view'));renderWho();dutyBadge()}
function renderWho(){$('#farmTitle').innerHTML=`<img src="${logoSrc()}" alt="${esc(S.farm.name||t('appTitle'))}">`;
  const fl=$('#fmLink');if(fl)fl.style.display=S.user&&S.user.mill&&HOSTED()?'':'none';const vl=$('#vhLink');if(vl)vl.style.display=S.user&&(S.user.role==='admin'||S.user.veh)&&HOSTED()?'':'none';

  <button class="wide" id="lo">🚪 ${t(dutyRole()&&TR.active()?'endDutyLogout':'logout')}</button>`);$('#lo').onclick=endDutyAndLogout;

/* ---------- boot ---------- */
function ready(){if(applySession()&&!S.user.role){if(S.user.mill&&HOSTED()){location.replace('feedmill/');return}setSess(null);S.user=null}if(applySession()){$('#login').classList.remove('show');document.body.classList.remove('locked');buildNav();route()}else lgRefresh();renderWho()}
const lsFlag=k=>{try{return localStorage.getItem(k)==='1'}catch(e){return false}};
const pubCache=()=>{try{const v=JSON.parse(localStorage.getItem('lf-pubstaff')||'null');return Array.isArray(v)&&v.length?v:null}catch(e){return null}};
async function boot(){
  if(LANG!=='en'&&LANG!=='ta'){LANG='en';$('#langPick').classList.add('show')}
  document.body.classList.toggle('ta',LANG==='ta');document.documentElement.lang=LANG;
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
  if(typeof FB!=='undefined'&&FB&&lsFlag('lf-secured')&&pubCache()){S.secured=true;S.staff=pubCache();S.staffLoaded=true}
  if(!getSess())showLogin();else{$('#login').classList.add('show');$('#login').innerHTML=`<div class="lg-box">${lgTop()}<div class="lg-h sm">${t('loadingData')}</div>${lgFoot()}</div>`}
  let d=null,u=null;
  if(window.claude&&window.claude.use){try{[d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}}
  if(!d){S.mode='local';S.canSettings=true;S.staffLoaded=true;loadLocal();ready();return}
  db=d;userCap=u;S.mode='cloud';compute();
  try{S.isOwner=u?u.isOwner():false;S.canSettings=u?u.canEdit():false;const me=u&&await u.me();S.myName=(me&&me.name)||''}catch(e){}
  const banner=$('#banner');let first=false;
  const timer=setTimeout(()=>{banner.style.display='block';banner.innerHTML=`${esc(t(S.staffLoaded?'savedData':'cantReach'))} <button class="small" style="margin-left:6px" onclick="location.reload()">↻ ${esc(t('retry')||'Retry')}</button>`;if(!first){first=true;ready()}},20000);
  const ok=()=>{clearTimeout(timer);banner.style.display='none'};
  const err=e=>{if(e&&e.code==='permission-denied')return;clearTimeout(timer);banner.style.display='block';banner.textContent=e&&e.code==='revoked'?t('accessEnded'):t('liveStopped')};
  const list=snap=>snap.docs.map(x=>({id:x.id,...x.data()}));const map=snap=>{const o={};snap.docs.forEach(x=>o[x.id]=x.data());return o};
  let rq=null,dayInit=false;const later=()=>{if(rq)return;rq=setTimeout(()=>{rq=null;compute();if(S.user&&!applySession())showLogin();refresh()},60)};
  /* daily entries: the full history once a week (or when this phone has none saved); otherwise the saved copy plus only days changed recently.
     Keeps database reads small as the history grows, so the farm stays on the free plan. */
  const dayFull=()=>db.collection('day').onSnapshot({includeMetadataChanges:true},s=>{if(!s.metadata.fromCache){ok();try{localStorage.setItem('lf-dayfull',JSON.stringify({at:Date.now(),n:s.size}))}catch(e){}}if(!dayInit||!s.docChanges||s.docChanges().length){dayInit=true;S.day=map(s);later()}},err);
  (async()=>{let last={};try{last=JSON.parse(localStorage.getItem('lf-dayfull')||'{}')}catch(e){}
    if(!last.at||Date.now()-last.at>7*864e5||!db.collection('day').where)return dayFull();
    let base=null,maxU=0;try{const c=await db.collection('day').get({source:'cache'});if(c.size>=num(last.n)){base={};c.docs.forEach(x=>{base[x.id]=x.data();maxU=Math.max(maxU,num(x.data()._u))})}}catch(e){}
    if(!base||!maxU)return dayFull();
    S.day=base;dayInit=true;later();
    db.collection('day').where('_u','>',maxU-3*864e5).onSnapshot({includeMetadataChanges:true},s=>{if(!s.metadata.fromCache)ok();let ch=0;s.docs.forEach(x=>{const d=x.data();if(JSON.stringify(S.day[x.id])!==JSON.stringify(d)){S.day[x.id]=d;ch++}});if(ch)later()},err)})();
  db.collection('visits').where('date','>=',addDays(today(),-8)).onSnapshot(s=>{S.visits=list(s);later()},err);
  db.collection('vacc').onSnapshot(s=>{S.vacc=list(s);later()},err);
  db.collection('duty').where('date','>=',addDays(today(),-31)).onSnapshot(s=>{S.duty=map(s);later()},err);
  db.doc('settings/farm').onSnapshot(s=>{S.farm=s.exists?s.data():{};later()},err);
  db.doc('settings/flock').onSnapshot({includeMetadataChanges:true},s=>{if(s.metadata&&!s.metadata.fromCache)window.__srvAt=Date.now();S.flock=s.exists?s.data():{};later()},err);
  db.doc('settings/batches').onSnapshot(s=>{S.bt=s.exists?s.data():{list:[],mv:[]};later()},err);
  db.doc('settings/cost').onSnapshot(s=>{S.cost=s.exists?s.data():{};later()},err);
  db.doc('settings/std').onSnapshot(s=>{S.std=s.exists?(s.data().text||''):'';later()},err);
  db.doc('settings/logo').onSnapshot(s=>{S.logo=s.exists?(s.data().img||''):'';later();if(!S.user&&$('#login').classList.contains('show'))lgRefresh()},err);
  ['items','reg','days','rmin'].forEach(c=>db.collection('fm_'+c).onSnapshot(s=>{const o={};s.docs.forEach(x=>o[x.id]=x.data());FMS[c]=o;FMS.ver++;_fmc={};later()},()=>{}));
  db.doc('settings/hr').onSnapshot(s=>{S.hr=s.exists?s.data():{};later()},err);
  db.collection('hrat').onSnapshot(s=>{S.hrat=map(s);later()},err);
  db.collection('hrled').onSnapshot(s=>{S.hrled=list(s);later()},err);
  db.doc('settings/parties').onSnapshot(s=>{S.parties=s.exists?(s.data().list||[]):[];later()},err);
  let pubStaff=null,secStaff=null,setStaff=null;const pickStaff=()=>{S.secured=!!(pubStaff&&pubStaff.secured)||lsFlag('lf-secured');if(S.secured&&!pubStaff){const c=pubCache();if(c)pubStaff={secured:true,list:c}}S.staff=S.secured?((secStaff&&secStaff.length&&SEC.authed())?secStaff:(pubStaff.list||[])):(setStaff||[])};
  const pubGot=s=>{if(!s.exists&&s.metadata&&s.metadata.fromCache)return;pubStaff=s.exists?s.data():null;if(pubStaff&&pubStaff.secured){try{localStorage.setItem('lf-secured','1');localStorage.setItem('lf-pubstaff',JSON.stringify(pubStaff.list||[]))}catch(e){}}pickStaff();if(S.secured){S.staffLoaded=true;if(!first){first=true;ok();ready()}else if(!S.user&&$('#login').classList.contains('show'))lgRefresh()}later()};
  /* login names: listen, re-listen after an error, and ask the server directly until they arrive */
  const pubListen=()=>db.doc('public/staff').onSnapshot(pubGot,e=>{console.warn('names',e&&e.code);setTimeout(pubListen,2500)});pubListen();
  window.__pubFetch=async ms=>{try{const s=await Promise.race([db.doc('public/staff').get({source:'server'}),new Promise((_,rj)=>setTimeout(()=>rj({code:'timeout'}),ms||8000))]);pubGot(s);return true}catch(e){console.warn('names fetch',e&&e.code);try{firebase.firestore().enableNetwork()}catch(x){}return false}};
  (async()=>{for(let i=0;i<20&&!S.staffLoaded;i++){await new Promise(z=>setTimeout(z,i?4000:3000));if(!S.staffLoaded)await __pubFetch(8000)}})();
  db.doc('secure/staff').onSnapshot(s=>{secStaff=s.exists?(s.data().list||[]):null;pickStaff();later()},()=>{});
  db.doc('settings/staff').onSnapshot({includeMetadataChanges:true},s=>{setStaff=s.exists?(s.data().list||[]):[];pickStaff();if(!s.metadata.fromCache)ok();
    if(s.exists||!s.metadata.fromCache){S.staffLoaded=true;if(!first){first=true;ready()}else if(!S.user&&$('#login').classList.contains('show'))lgRefresh()}later()},err)}
boot();
